<!DOCTYPE html>
<html>
<head>
  <title>Flipkart Box Structure</title>

  <style>
    body {
      margin: 0;
      background-color: white;
      font-family: Arial, sans-serif;
    }

    .page-box {
      width: 1000px;
      background-color: white;
      border: 3px solid: black;
      border-radius: 10px;
      margin: 30px auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .navbar-box {
      height: 60px;
      background-color: blue;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-small-box {
      width: 120px;
      height: 35px;
      background-color: white;
      border: 2px solid white;
      border-radius: 6px;
    }

    .category-box {
      height: 90px;
      background-color: white;
      border: 2px solid blue;
      border-radius: 8px;
      margin-bottom: 15px;
      
    }
   .small-category-box{
    width: 120px;
    height: 60px;
      background-color: black;
      border: 2px solid black;
      border-radius: 8px;
      margin-bottom: 15px;
}
    .banner-box {
      height: 160px;
      background-color: lightgoldenrodyellow;
      border: 2px solid yellow;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .content-box {
      display: flex;
      gap: 15px;
    }

    .filter-box {
      width: 220px;
      height: 420px;
      background-color: whitesmoke;
      border: 2px solid green;
      border-radius: 8px;
    }

    .products-box {
      flex: 1;
      height: 420px;
      background-color: white;
      border: 2px solid grey;
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product-card {
      height: 170px;
      background-color: white;
      border: 2px solid palevioletred;
      border-radius: 8px;
    }

    .product-card:nth-child(2) {
      background-color: white;
      border-color: violet;
    }

    .product-card:nth-child(3) {
      background-color: white;
      border-color: red;
    }

    .product-card:nth-child(4) {
      background-color: white;
      border-color: lightblue;
    }

    .product-card:nth-child(5) {
      background-color: lightyellow;
      border-color: orangered;
    }

    .product-card:nth-child(6) {
      background-color: white;
      border-color: #0f766e;
    }
  </style>
</head>
<body>

  <div class="page-box">

    <div class="navbar-box">
      <div class="nav-small-box"></div>
      <div class="nav-small-box"></div>
    </div>

    <div class="category-box">
        <div class="small-category-box"></div>
        <div class="small-category-box"></div>
    </div>

    <div class="banner-box"></div>

    <div class="content-box">

      <div class="filter-box"></div>

      <div class="products-box">
        <div class="product-grid">
          <div class="product-card"></div>
          <div class="product-card"></div>
          <div class="product-card"></div>
          <div class="product-card"></div>
          <div class="product-card"></div>
          <div class="product-card"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
