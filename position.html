<!DOCTYPE html>
<html>
<head>
    <title>Box Navigation Bar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #222;
            padding: 10px;
            display: flex;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            border: 2px solid white;
            padding: 12px 25px;
            margin: 5px;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

</body>
</html>
