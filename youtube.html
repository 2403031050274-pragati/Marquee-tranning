<!DOCTYPE html>
<html>
<head>
  <title>YouTube Box</title>

  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: Arial;
    }

    .top {
      background-color: #111;
      height: 60px;
      padding: 10px;
    }

    .logo {
      background-color: red;
      width: 120px;
      height: 40px;
      display: inline-block;
      border-radius: 8px;
    }

    .search {
      background-color: #333;
      width: 500px;
      height: 40px;
      display: inline-block;
      margin-left: 250px;
      border-radius: 20px;
    }

    .circle {
      background-color: pink;
      width: 40px;
      height: 40px;
      display: inline-block;
      margin-left: 20px;
      border-radius: 50%;
    }

    .side {
      background-color: #111;
      width: 200px;
      height: 650px;
      display: inline-block;
      padding: 15px;
      vertical-align: top;
    }

    .sidebox {
      background-color: #333;
      width: 170px;
      height: 40px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .main {
      background-color: black;
      width: 1000px;
      height: 650px;
      display: inline-block;
      padding: 20px;
      vertical-align: top;
    }

    .chip {
      background-color: #333;
      width: 110px;
      height: 35px;
      display: inline-block;
      margin: 8px;
      border-radius: 20px;
    }

    .video {
      background-color: #222;
      width: 300px;
      height: 250px;
      display: inline-block;
      margin: 15px;
      border-radius: 12px;
      padding: 10px;
    }

    .thumb {
      background-color: gray;
      width: 300px;
      height: 160px;
      border-radius: 12px;
    }

    .profile {
      background-color: red;
      width: 40px;
      height: 40px;
      display: inline-block;
      margin-top: 12px;
      border-radius: 50%;
    }

    .linebox {
      display: inline-block;
      margin-left: 10px;
    }

    .line {
      background-color: #555;
      width: 220px;
      height: 15px;
      margin-bottom: 8px;
      border-radius: 5px;
    }

    .smallline {
      background-color: #444;
      width: 150px;
      height: 12px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="top">
    <div class="logo"></div>
    <div class="search"></div>
    <div class="circle"></div>
  </div>

  <div class="side">
    <div class="sidebox"></div>
    <div class="sidebox"></div>
    <div class="sidebox"></div>
    <div class="sidebox"></div>
    <div class="sidebox"></div>
  </div>

  <div class="main">

    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>
    <div class="chip"></div>

    <br>

    <div class="video">
      <div class="thumb"></div>
      <div class="profile"></div>
      <div class="linebox">
        <div class="line"></div>
        <div class="smallline"></div>
      </div>
    </div>

    <div class="video">
      <div class="thumb"></div>
      <div class="profile"></div>
      <div class="linebox">
        <div class="line"></div>
        <div class="smallline"></div>
      </div>
    </div>

    <div class="video">
      <div class="thumb"></div>
      <div class="profile"></div>
      <div class="linebox">
        <div class="line"></div>
        <div class="smallline"></div>
      </div>
    </div>

  </div>

</body>
</html>
