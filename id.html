<!DOCTYPE html>
<html>
<head>
  <title>Company ID Card</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: lightgray;
      font-family: Arial;
    }

    .card {
      width: 300px;
      background-color: white;
      margin: 50px auto;
      border: 2px solid black;
      text-align: center;
      padding-bottom: 15px;
    }

    .header {
      background-color: navy;
      color: white;
      padding: 15px 15px 60px 15px;
    }

    .photo {
      width: 100px;
      height: 100px;
      background-color: gray;
      margin: -50px auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid white;
    }

    .photo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 15px;
    }

    .icons i {
      font-size: 22px;
    }

    .twitter {
      color: lightblue
    }

    .facebook {
      color: blue;
    }

    .instagram {
      color: pink;
    }

    .youtube {
      color: red;
    }

    .box {
      width: 200px;
      height: 50px;
      background-color:white;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .smallbox {
      width: 100px;
      height: 25px;
      background-color: skyblue;
      border-radius: 20px;
    }

    .actions{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
}

.action-btn{
    border:none;
    background:#f0f0f0;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}
    
  </style>
</head>
<body>

  <div class="card">

    <div class="header"></div>

    <div class="photo">
      <img src="C:/Users/AGPC/Downloads/pragati phto .jpeg" alt="Profile Photo">
    </div>

    <h3>Pragati</h3>
    <p>Youtuber & Blogger</p>

    <div class="icons">
      <i class="fa-brands fa-twitter twitter"></i>
      <i class="fa-brands fa-facebook facebook"></i>
      <i class="fa-brands fa-instagram instagram"></i>
      <i class="fa-brands fa-youtube youtube"></i>
    </div>

    <div class="box">
      <div class="smallbox">subscribe</div>
      <div class="smallbox">message</div>
    </div>

    <div class="actions">
        <button class="action-btn">
            <i class="fa fa-heart"></i> Like
        </button>

        <button class="action-btn">
            <i class="fa fa-comment"></i> Comment
        </button>

        <button class="action-btn">
            <i class="fa fa-share"></i> Share
        </button>
    </div>

  </div>

</body>
</html>
