<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    :root {
      --maincolor: red;
      --Hheight: 300px;
      --defaultwidth: 300px;
      --Bborder: 2px solid black;
      --BBborderradius: 8px;
      --Ddisplay: inline-block;
    }

    .container {
      height: 800px;
      width: 800px;
      background-color: var(--maincolor);
      border: var(--Bborder);
      border-radius: var(--BBborderradius);
    }
   .square{
    height: var(--Hheight);
      width: var(--defaultwidth);
      background-color: var(--maincolor);
      border: var(--Bborder);
      border-radius: var(--BBborderradius);
      display: var(--Ddisplay);
}
    .rectangle {
      height: 200px;
      width: 400px;
      background-color: var(--maincolor);
      border: var(--Bborder);
      border-radius: var(--BBborderradius);
      display: var(--Ddisplay);
    }

    .circle {
      height: var(--Hheight);
      width: var(--defaultwidth);
      background-color: var(--maincolor);
      border: var(--Bborder);
      border-radius: 50%;
      display: var(--Ddisplay);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="square"></div>
    <div class="square"></div>
    <div class="rectangle"></div>
    <div class="circle"></div>
  </div>
  
</body>
</html>
