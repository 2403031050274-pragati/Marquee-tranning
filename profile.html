<!DOCTYPE html>
<html>
<head>
  <title>Profile Structure</title>

  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .profile-box {
      width: 550px;
      background-color: white;
      border: 3px solid black;
      padding: 25px;
      margin: 50px auto;
      border-radius: 10px;
      text-align: center;
    }

    .profile-circle {
      width: 120px;
      height: 120px;
      background-color: lightblue;
      border: 3px solid blue;
      border-radius: 50%;
      margin: 0 auto 20px;
    }

    .profile-rectangle {
      width: 350px;
      height: 60px;
      background-color: lightgreen;
      border: 3px solid green;
      margin: 0 auto 20px;
      border-radius: 8px;
    }

    .profile-rectangle2 {
      width: 420px;
      height: 80px;
      background-color: lightyellow;
      border: 3px solid orange;
      margin: 0 auto 20px;
      border-radius: 8px;
    }

    .profile-squares {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .profile-square {
      width: 70px;
      height: 70px;
      background-color: pink;
      border: 3px solid red;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="profile-box">

    <div class="profile-circle"></div>

    <div class="profile-rectangle"></div>

    <div class="profile-rectangle2"></div>

    <div class="profile-squares">
      <div class="profile-square"></div>
      <div class="profile-square"></div>
      <div class="profile-square"></div>
      <div class="profile-square"></div>
      <div class="profile-square"></div>
    </div>

  </div>

</body>
</html>
